[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vwap-pullback-bot"
version = "0.1.0"
description = "Deterministic VWAP market-structure paper replay bot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vwap-bot = "vwap_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["vwap_bot*"]
